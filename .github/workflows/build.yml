name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        env:
          ANDROID_HOME_FALLBACK: /usr/local/lib/android/sdk
        run: |
          set -e
          SDK_HOME="${ANDROID_HOME:-$ANDROID_HOME_FALLBACK}"
          echo "ANDROID_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_HOME" > local.properties
          echo "ANDROID_HOME=$SDK_HOME"
          ls -1 "$SDK_HOME" || true

          SM="$SDK_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$SDK_HOME" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager=$SM"
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "::error::sdkmanager not found under $SDK_HOME"
            exit 1
          fi

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "---- platforms ----"
          ls -1 "$SDK_HOME/platforms"
          echo "---- build-tools ----"
          ls -1 "$SDK_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SOLARPANEL_KEYSTORE_PASSWORD || 'solarpanel' }}
        run: |
          set -e
          echo "SOLARPANEL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          if [ -f keystore/solarpanel.jks ]; then
            echo "Using the keystore committed in the repository."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore found, generating a new one."
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/solarpanel.jks \
              -alias solarpanel \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Solarpanel, OU=Self-hosted, O=Solarpanel, L=Local, ST=Local, C=CN"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -e
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)"
          SRC="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          mkdir -p dist
          DEST="dist/solarpanel-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "Built $DEST"
          ls -lh dist
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          set +e
          AAPT="$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f | head -n 1)"
          echo "--- aapt2 dump badging ---"
          "$AAPT" dump badging "${{ steps.apk.outputs.apk_path }}" 2>/dev/null | head -n 15
          echo "--- apksigner verify ---"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | head -n 1)"
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.apk_path }}" 2>&1 | head -n 12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarpanel-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: solarpanel v${{ steps.apk.outputs.version }}
          body: |
            solarpanel 原生安卓客户端（Kotlin），面板来自 https://github.com/Ozero-top/Solar-Panel

            - 应用名：solarpanel（沿用原有图标）
            - versionName：${{ steps.apk.outputs.version }}
            - 所有页面在应用内打开，不跳转外部浏览器
            - 屏幕左缘手势滑动后退；在首页再滑动一次即可退出（系统返回键同样支持）
            - 全面屏适配：顶栏不与手机状态栏重叠，底部内容避开导航栏 / 手势条
            - 进入服务页面后顶栏出现 ✕，点一下即返回面板首页
            - 顶栏 ⋮ 弹出底部操作面板：刷新、手机 / 电脑模式、修改地址、清除缓存等
            - 首次启动需填写部署在飞牛 / NAS 上的 solarpanel 地址

            安装方式：下载下方 APK，在手机上允许「安装未知来源应用」后直接安装；可直接覆盖旧版。
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          make_latest: true
